
name: Build DQuant Lab Linux

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BACKBOARD_KEEP_COPILOT_SHIM_MARKER: "1"
      BACKBOARD_CLI_TARGET: bun-linux-x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail

          # These headers are the only thing the build needs from apt; every
          # runtime library below already ships in the ubuntu-24.04 image.
          PACKAGES=(
            build-essential pkg-config python3
            fakeroot dpkg-dev
            libx11-dev libxkbfile-dev
            libsecret-1-dev libkrb5-dev
            libgtk-3-dev libnss3 libasound2t64
            libxss1 libu2f-udev dbus-x11
            xdg-utils libxrandr2
          )
          # The runner resolves apt through
          # `URIs: mirror+file:/etc/apt/apt-mirrors.txt`, and that list ranks
          # mirrors that regularly misbehave: security.ubuntu.com is IPv6-first
          # (the runner has no IPv6 route: "Network is unreachable") and answers
          # 503 over IPv4, while us-east-2.ec2.archive.ubuntu.com silently drops
          # package fetches. Pin the plain IPv4 archive mirror first and keep
          # security only as a fallback, then retry hard: apt's own Acquire
          # retries cover per-file 503s, the loop covers a mirror that dies
          # mid-run.
          APT_OPTS=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo "Runner apt mirrorlist before rewrite:"
            cat /etc/apt/apt-mirrors.txt
            printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

          # A failed index refresh must not fail the job: the image ships valid
          # package lists, and the install below fails loudly if it cannot
          # resolve a package anyway.
          sudo apt-get update "${APT_OPTS[@]}" \
            || echo "apt-get update failed; continuing with the runner's cached package lists."

          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y --fix-missing "${APT_OPTS[@]}" "${PACKAGES[@]}"; then
              exit 0
            fi
            echo "apt-get install failed (attempt ${attempt}); retrying in $((attempt * 15))s." >&2
            sleep $((attempt * 15))
          done
          echo "Unable to install the Linux build dependencies after 5 attempts." >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: backboard/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install DQuant Lab dependencies
        working-directory: backboard
        run: npm ci --no-audit --no-fund

      - name: Install CLI dependencies
        working-directory: backboard/cli-ts
        run: bun install --frozen-lockfile

      # The packaged app loads the DQuant Lab extension from extensions/backboard,
      # and its runtime binary from extensions/backboard/bin. Both are generated
      # artifacts, so they must exist before gulp packs the built-in extensions;
      # otherwise the installer ships an extension without out/ and bin/ and
      # every key validation fails with "cli-ts binary not found".
      - name: Build the DQuant Lab extension and CLI runtime
        working-directory: backboard
        run: npm --prefix extensions/backboard run compile

      - name: Build Linux application
        working-directory: backboard
        run: |
          node --max-old-space-size=8192 \
            --experimental-strip-types \
            ./node_modules/gulp/bin/gulp.js \
            vscode-linux-x64

      # Fail the build instead of publishing an installer whose DQuant Lab
      # extension or CLI runtime is missing; the packaged app cannot validate
      # provider keys or start agent sessions without them.
      - name: Verify the packaged DQuant Lab extension
        working-directory: backboard
        run: |
          set -euo pipefail
          PACKAGED="../VSCode-linux-x64/resources/app/extensions/backboard"
          for required in \
            "${PACKAGED}/package.json" \
            "${PACKAGED}/out/extension.js" \
            "${PACKAGED}/bin/backboard-cli-ts"; do
            if [[ ! -e "${required}" ]]; then
              echo "Missing packaged path: ${required}" >&2
              exit 1
            fi
          done
          CLI_INFO="$(file -b "${PACKAGED}/bin/backboard-cli-ts")"
          if [[ "${CLI_INFO}" != *ELF* || "${CLI_INFO}" != *x86-64* ]]; then
            echo "Packaged CLI has the wrong architecture: ${CLI_INFO}" >&2
            exit 1
          fi

      - name: Prepare Debian package
        working-directory: backboard
        run: |
          node --max-old-space-size=8192 \
            --experimental-strip-types \
            ./node_modules/gulp/bin/gulp.js \
            vscode-linux-x64-prepare-deb

      - name: Build Debian package
        working-directory: backboard
        run: |
          node --max-old-space-size=8192 \
            --experimental-strip-types \
            ./node_modules/gulp/bin/gulp.js \
            vscode-linux-x64-build-deb

      - name: Find generated package
        working-directory: backboard
        run: |
          find .build/linux/deb -type f -name "*.deb" -print
          du -sh .build/linux/deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dquant-lab-linux-deb
          path: backboard/.build/linux/deb/amd64/deb/*.deb
          if-no-files-found: error
          retention-days: 3
